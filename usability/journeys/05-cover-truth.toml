id = "cover-truth"
goal = "Skip from an album with a cover into one whose cover cannot be fetched (the server just went): what is drawn must belong to what is named."
# Timeline: online while the covered album plays and the next album is queued and
# mirrored; then the server goes and the listener skips into the next album.
start = "online"
# blocked only. The stale cover is a PENDING-fetch bug: the outgoing art is held until
# the new cover's fetch answers. Under blocked that fetch hangs, so the old album's
# cover sits under the new title and the check bites. Under no_network the connect is
# refused at once, the fetch answers None within milliseconds and every build (master
# included) drops to the swatch before the snap, so that state could only ever pass -
# a check that cannot fail is not evidence, so it is not claimed here.
states = ["blocked"]
min_steps = 8          # open Albums, pick, play, move, enqueue, then one skip key
step_budget = 8        # three times across the album boundary
script = [
  "key F2",
  "wait 6",
  "key Right",
  "key Enter",
  "key Right",
  "key Space",
  "wait 10",
  "snap cover-drawn",
  "net {state}",
  "key >",
  "key >",
  "key >",
  "wait 3",
  "snap after-the-skip",
]

[[check]]
name = "setup: the covered album plays and its cover is drawn in cells"
at = 8
severity = "S1"
truth = ["status.state == play", "currentsong.Album == Held Harbour"]
screen_require_re = ["[\U0001FB00-\U0001FB3B▌▐]"]
# The deck, not the Albums grid (which draws covers of its own).
screen_region = "deck"

[[check]]
name = "setup: the skip landed in the next album and it plays (from disk)"
severity = "S1"
truth = ["currentsong.Album == Stream Summit", "status.state == play"]

[[check]]
name = "after the skip the screen names the new song"
severity = "S0"
screen_require_any = ["Ascent"]

[[check]]
name = "no cell of the previous album's cover remains under the new title"
severity = "S0"
# The DECK's cells only: the Albums body is a cover grid, where Held Harbour's own cover
# under its own name is correct and is not what this check is about.
screen_region = "deck"
screen_forbid_re = ["[\U0001FB00-\U0001FB3B▌▐]"]
