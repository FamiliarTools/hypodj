id = "drop-mid-song"
goal = "You are listening to a song streamed from the server when the server drops. Understand what happened and what still plays."
# Timeline: online at start, the drop happens at step 4, then real time passes.
# `online` is the control run (no drop).
start = "online"
states = ["online", "blocked", "no_network"]
min_steps = 0          # after the drop, the answer must come to the listener unasked
step_budget = 4        # the scripted setup to start a streamed song
# A queue LONGER than the prefetch window: with one song mirrored ahead, the third
# song of Stream Summit is never fetched before the drop, so the "never fetched song
# is due" checks below have a real song to judge instead of an n/a.
store_queue_ahead = 1
script = [
  "key F2",
  "wait 2",
  "key j",
  "key j",
  "key Enter",
  "wait 5",
  "net {state}",
  "wait 10",
  "snap ten-seconds-after",
  "wait 40",
  "snap fifty-seconds-after",
  "wait 75",
  "snap after-the-buffered-song-ends",
  "wait 115",
  "snap when-the-unfetched-song-is-due",
  "wait 20",
  "snap half-a-minute-after-due",
  "wait 60",
  "snap ninety-seconds-after-due",
]

[[check]]
name = "setup: a streamed (not held) song was playing before the drop"
at = 6
truth = ["status.state == play", "currentsong.Album == Stream Summit"]

[[check]]
name = "within 10s the screen says the server is gone"
at = 9
when = ["blocked", "no_network"]
severity = "S0"
screen_require_any = ["unreachable", "no network", "server down", "connection lost", "lost the server", "cannot reach"]

[[check]]
name = "control: no false alarm while online"
when = ["online"]
severity = "S0"
screen_forbid = ["unreachable", "no network", "server down"]

[[check]]
name = "screen transport word matches the daemon (no stale 'playing')"
severity = "S0"
transport_matches = true

[[check]]
# Not "Up Next lies": the store mirrors the queue window (store.rs, reason=Window)
# within seconds of the enqueue, so these songs WERE on disk when the server went.
# Decision (b) still asks every row to say so in words while the server is gone.
name = "the next song states availability in words while the server is gone (decision b)"
at = 11
when = ["blocked", "no_network"]
severity = "S1"
if_truth = ["currentsong.Title exists"]
screen_require_any = ["on disk", "stream only", "not on disk", "downloaded"]

[[check]]
name = "when a song that was never fetched is due: still playing, or the screen says why not"
at = 15
when = ["blocked", "no_network"]
severity = "S1"
if_truth = ["status.state != play"]
screen_require_any = ["unreachable", "not on disk", "stream only", "could not", "couldn't", "failed", "no network"]

[[check]]
name = "when a song that was never fetched is due: transport word matches the daemon"
at = 15
severity = "S0"
transport_matches = true

[[check]]
# Daemon truth, not the screen: Thin Air was mirrored (reason=Window) while the
# server was still there, so losing the server must not lose that fact.
name = "a song mirrored before the drop is still on disk per the daemon (never evicted offline)"
at = 11
when = ["blocked", "no_network"]
severity = "S1"
truth = ["playlistinfo[Title=Thin Air].X-Offline == 1"]

[[check]]
# The next song now rides ONE line on the deck (`next  Thin Air · on disk`) where
# the old Up Next pane put the words on the line under the title.
name = "the deck says the mirrored next song is on disk (no stale 'stream only')"
at = 11
when = ["blocked", "no_network"]
severity = "S1"
screen_require_re = ["Thin Air[^\\n]*on disk"]

[[check]]
# A blocked server makes a stream connect HANG rather than fail. Within a bounded
# time the daemon must stop pretending: not 'playing' a song it cannot fetch.
name = "half a minute after an unfetchable song is due, the daemon no longer claims it plays"
at = 17
when = ["blocked", "no_network"]
severity = "S0"
truth = ["status.elapsed != 0.000"]
if_truth = ["status.state == play"]

[[check]]
name = "half a minute after an unfetchable song is due, the screen says why it is not playing"
at = 17
when = ["blocked", "no_network"]
severity = "S1"
if_truth = ["status.state != play"]
screen_require_re = ["could(n't| not) (play|fetch|stream)[^\\n]*Ridge Line|Ridge Line[^\\n]*(not on disk|unreachable|could(n't| not))"]

[[check]]
name = "transport word matches the daemon ninety seconds after due"
at = 19
severity = "S0"
transport_matches = true
