[workspace]
resolver = "2"
members = [
    "crates/hypodj-core",
    "crates/hypodj-dsl",
    "crates/hypodj-nl",
    "crates/hypodj-daemon",
    "crates/hypodj-cli",
    "crates/hypodj-client",
    "crates/hypodj-mcp",
    "crates/hypodj-tui",
    "crates/hypodj-search",
    "crates/hypodj-build-info",
    "crates/hypodj-style",
    "crates/hypodj-app",
    "crates/hypodj-gtk",
    "crates/hypodj-qt",
    "crates/hypodj-sense",
]

[workspace.package]
# One semver for the whole workspace, bumped in exactly one place at release.
# Member crates inherit via `version.workspace = true`; display-time enrichment
# (commits-since-tag + short hash) is layered on by hypodj-build-info.
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
# Functional Source License 1.1, MIT future license (LICENSE.md): each release
# becomes MIT two years after it is made available.
license = "FSL-1.1-MIT"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "signal", "time", "process"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
thiserror = "2"
ratatui = "0.29"
crossterm = "0.28"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Pinned exactly: opensubsonic 0.3.0 is a young, single-maintainer crate (first
# published Feb 2026). The `subsonic` wrapper is the mitigation seam; pinning the
# exact version is the second guard so a silent minor bump can't reshape the wire
# types this whole layer maps. See README "Accepted risks".
opensubsonic = "=0.3.0"
# opensubsonic::Client::stream_url returns url::Url; we keep that type through our
# wrapper (no parse round-trip on the handoff to the player), so we name it here.
url = "2"

[profile.dev]
# Keep foundation builds cheap; the audio/link step is the expensive part.
opt-level = 0

# The opt-in local model (hypodj-nl `llm-llama`): an unoptimized llama.cpp decodes
# a 0.5B model roughly ten times slower, past the translator deadline. Only this
# C++ crate is optimized; the workspace stays opt-level 0.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3

# dj-sense's synthetic-video test renders and face-scans 1800 frames; at
# opt-level 0 the cascade alone takes minutes. Only these two crates.
[profile.dev.package.rustface]
opt-level = 3
[profile.dev.package.hypodj-sense]
opt-level = 2
